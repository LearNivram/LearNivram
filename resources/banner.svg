<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="LearNivram – Hinten Go. Vorne Svelte." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="380" rx="18" fill="#0C0E10"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="17.5" fill="none" stroke="#23272B"/>

  <!-- Wortmarke -->
  <rect x="56" y="50" width="10" height="22" fill="#3CC8E8"/>
  <rect x="69" y="50" width="10" height="22" fill="#FF5A1F"/>
  <text x="92" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#F2EFE9">LearNivram</text>

  <!-- Headline -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-3" fill="#F2EFE9">
    <text x="54" y="196">Hinten <tspan fill="#3CC8E8">Go.</tspan></text>
    <text x="54" y="282">Vorne <tspan fill="#FF5A1F">Svelte.</tspan></text>
  </g>
  <text x="56" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.6" fill="#A3A8AD">FULL STACK DEVELOPER · IN AUSBILDUNG</text>

  <!-- Code-Karten -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="690" y="52" width="420" height="132" fill="#14181B" stroke="#23272B"/>
    <rect x="690" y="52" width="420" height="3" fill="#3CC8E8"/>
    <text x="708" y="80" font-size="12" fill="#A3A8AD">main.go</text>
    <text x="1092" y="80" font-size="12" fill="#3CC8E8" text-anchor="end">Backend</text>
    <line x1="690" y1="92" x2="1110" y2="92" stroke="#23272B"/>
    <text x="708" y="118" fill="#F2EFE9"><tspan fill="#3CC8E8">func</tspan> main() {</text>
    <text x="726" y="141" fill="#F2EFE9">mux.HandleFunc(<tspan fill="#E8D9A0">"GET /api/projects"</tspan>, list)</text>
    <text x="726" y="164" fill="#F2EFE9">http.ListenAndServe(<tspan fill="#E8D9A0">":8080"</tspan>, mux) }</text>

    <rect x="730" y="196" width="420" height="132" fill="#14181B" stroke="#23272B"/>
    <rect x="730" y="196" width="420" height="3" fill="#FF5A1F"/>
    <text x="748" y="224" font-size="12" fill="#A3A8AD">Projects.svelte</text>
    <text x="1132" y="224" font-size="12" fill="#FF5A1F" text-anchor="end">Frontend</text>
    <line x1="730" y1="236" x2="1150" y2="236" stroke="#23272B"/>
    <text x="748" y="262" fill="#F2EFE9"><tspan fill="#FF5A1F">{#each</tspan> projects <tspan fill="#FF5A1F">as</tspan> project<tspan fill="#FF5A1F">}</tspan></text>
    <text x="766" y="285" fill="#F2EFE9"><tspan fill="#A3A8AD">&lt;Card</tspan> {...project} <tspan fill="#A3A8AD">/&gt;</tspan></text>
    <text x="748" y="308" fill="#FF5A1F">{/each}</text>
  </g>
</svg>
